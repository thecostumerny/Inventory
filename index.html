<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventory</title>
  <base target="_top">
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #cbd2d9;
      --fc: #1565c0;
      --mh: #2e7d32;
      --ba: #6a1b9a;
      --accent: #1565c0;
      --ok: #2e7d32;
      --ok-bg: #e8f5e9;
      --warn: #b26a00;
      --error: #c62828;
      --error-bg: #ffebee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; text-align: center; }

    /* Summary bar showing choices so far */
    #summary {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 4px;
    }
    .chip {
      font: inherit;
      color: var(--text);
      cursor: default;
      padding: 6px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.9rem;
    }
    .chip b { margin-left: 4px; }
    /* On the scan screen the pills can be tapped to change that choice */
    body.can-change .chip {
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      color: var(--text);
    }
    body.can-change .chip::after {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      margin-left: 7px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-3px) rotate(45deg);
    }
    body.can-change .chip:active { background: #e3eefb; border-color: var(--accent); }

    /* Keep the three pills on one line on phones: smaller text, and a long
       value (like JD/MK) is cut off with "…" rather than wrapping */
    #summary { flex-wrap: nowrap; gap: 6px; }
    .chip {
      display: inline-flex !important;
      align-items: center;
      min-width: 0;
      flex: 0 1 auto;
      white-space: nowrap;
      padding: 5px 10px;
      font-size: clamp(0.72rem, 3.3vw, 0.9rem) !important;
    }
    .chip[style*="none"] { display: none !important; }
    .chip b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    body.can-change .chip::after { flex: 0 0 auto; margin-left: 6px; }
    @media (max-width: 360px) {
      .chip { padding: 4px 8px; }
      body.can-change .chip::after { margin-left: 4px; width: 5px; height: 5px; }
    }

    /* Change-selection window */
    #pickModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.45);
      padding: 16px;
      overflow-y: auto;
    }
    #pickModal.open { display: block; }
    .pick-box {
      max-width: 520px;
      margin: 8vh auto 0;
      padding: 18px 16px;
      background: var(--bg);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }
    .pick-box h2 { margin: 0 0 14px; font-size: 1.2rem; text-align: center; }
    .pick-msg { min-height: 1.3em; margin-top: 10px; text-align: center; color: var(--error); font-weight: bold; }
    .pick-cancel {
      display: block; width: 100%; margin-top: 12px; padding: 12px 0;
      font-size: 1.05rem; background: transparent; color: var(--text);
      border: 1px solid var(--muted); border-radius: 10px; cursor: pointer;
    }
    #pickZoneGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 14px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .step { display: none; margin-top: 20px; }
    .step.active { display: block; }
    .step h2 { margin: 0 0 16px; font-size: 1.2rem; text-align: center; color: var(--muted); font-weight: normal; }

    /* Location buttons */
    .loc-buttons { display: flex; gap: 12px; }
    .loc-btn {
      flex: 1;
      padding: 36px 0;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .loc-btn:active { transform: scale(0.97); }
    .loc-btn:disabled { opacity: 0.5; cursor: wait; }
    #btnFC { background: var(--fc); }
    #btnMH { background: var(--mh); }
    #btnBA { background: var(--ba); }
    .loc-btn[data-loc="FC"] { background: var(--fc); }
    .loc-btn[data-loc="MH"] { background: var(--mh); }
    .loc-btn[data-loc="BA"] { background: var(--ba); }

    /* Inputs */
    .input-row { display: flex; gap: 10px; }
    input[type=text] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      font-size: 1.3rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-transform: uppercase;
    }
    input[type=text]:focus { outline: none; border-color: var(--accent); }
    .go-btn {
      padding: 0 22px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .go-btn:disabled { opacity: 0.4; cursor: default; }

    /* Zone quick-select grid */
    #zoneGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .zone-btn {
      padding: 16px 6px;
      font-size: 1.1rem;
      font-weight: bold;
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      word-break: break-word;
    }
    .zone-btn:active { background: #e3eefb; border-color: var(--accent); }
    .zone-btn.current { border-color: var(--accent); background: #e3eefb; }
    .zone-btn.done { background: var(--ok-bg); border-color: #a5d6a7; color: var(--ok); }
    .zone-btn.done::before { content: '✓ '; }

    /* Scan screen: mark zone complete */
    .zone-done-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 12px 0;
      font-size: 1.05rem;
      font-weight: bold;
      background: var(--card);
      color: var(--ok);
      border: 2px solid var(--ok);
      border-radius: 10px;
      cursor: pointer;
    }
    .zone-done-btn.is-done { color: var(--muted); border-color: var(--border); }

    /* Small "View status" link */
    /* Status is for admins only */
    .admin-only { display: none !important; }
    body.is-admin .admin-only { display: block !important; }
    .status-link {
      display: block;
      margin: 14px auto 0;
      padding: 6px 12px;
      font-size: 0.9rem;
      background: transparent;
      border: none;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Status window */
    .st-loc { padding: 12px; margin-bottom: 10px; background: var(--card); border-radius: 10px; }
    .st-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .st-head b { font-size: 1.1rem; }
    .st-sub { color: var(--muted); font-size: 0.9rem; }
    .st-pct { margin-top: 6px; font-size: 1rem; }

    /* Last 5 items counted on this device */
    .recent { max-width: 560px; margin: 16px auto 0; }
    .recent:empty { display: none; }
    .recent h4 { margin: 0 0 6px; font-size: 0.85rem; font-weight: normal; color: var(--muted); text-align: center; }
    .recent-row {
      display: flex; gap: 10px; align-items: baseline;
      padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 0.92rem;
    }
    .recent-row:last-child { border-bottom: none; }
    .recent-qty { flex: 0 0 auto; min-width: 2em; text-align: right; font-weight: bold; color: var(--ok); }
    .recent-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .recent-zone { flex: 0 0 auto; color: var(--muted); font-size: 0.85rem; }
    .recent-list { background: var(--card); border-radius: 10px; }
    .st-pct b { font-size: 1.5rem; color: var(--ok); }
    .st-bar { height: 8px; margin: 8px 0 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .st-bar span { display: block; height: 100%; background: var(--ok); }
    .st-zones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .st-zone {
      padding: 3px 8px; font-size: 0.85rem; border-radius: 6px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .st-zone.done { background: var(--ok-bg); color: var(--ok); border-color: #a5d6a7; }
    .st-zone.done::before { content: '✓ '; }
    #zoneEmpty { display: none; margin-top: 16px; text-align: center; color: var(--muted); }

    /* Scan */
    #itemsStatus { margin-top: 6px; text-align: center; color: var(--muted); font-size: 0.95rem; }
    #itemsStatus:empty { display: none; }
    /* Just enough room for one line of save alerts */
    #saveStatus { margin-top: 6px; text-align: center; font-weight: bold; font-size: 0.95rem; line-height: 1.3; min-height: 1.3em; }
    #saveStatus.ok { color: var(--ok); }
    #saveStatus.warn { color: var(--warn); }
    #saveStatus.error { color: var(--error); }
    #saveStatus.pending { color: var(--muted); font-weight: normal; }
    #scanResult { margin-top: 4px; }
    .result {
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--card);
    }
    .result.found { background: var(--ok-bg); border-color: var(--ok); }
    .result.notfound { background: var(--error-bg); border-color: var(--error); }
    .result h3 { margin: 0 0 10px; font-size: 1.2rem; }
    .result.found h3 { color: var(--ok); }
    .result.notfound h3 { color: var(--error); }
    .result table { width: 100%; border-collapse: collapse; }
    .result td { padding: 4px 0; vertical-align: top; }
    /* Compact found box */
    .result.found { padding: 8px 12px; border-width: 1px; border-radius: 10px; }
    .result.found h3 { display: none; }
    .result.found td { padding: 1px 0; font-size: 0.95rem; }
    .result.found { text-align: center; }
    .item-line {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 16px;
      font-size: 1rem;
      line-height: 1.4;
    }
    .item-desc { white-space: normal; overflow-wrap: anywhere; }
    .item-line .nowrap { white-space: nowrap; }
    /* SKU Description Price: one centered line that wraps when it's long */
    .item-line:not(.counts) { display: block; text-align: center; }
    .item-line.counts { margin-top: 4px; gap: 24px; color: var(--muted); }
    .item-line.counts b { color: var(--text); margin-left: 4px; }
    .result td:first-child { color: var(--muted); padding-right: 12px; white-space: nowrap; }
    .result td:last-child { font-weight: bold; word-break: break-word; }
    .result .note { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }
    .sku-fix { display: flex; gap: 8px; margin-top: 10px; }
    .sku-fix-input {
      flex: 1; min-width: 0;
      padding: 10px 12px; font-size: 1.15rem;
      border: 2px solid var(--border); border-radius: 8px;
      text-transform: uppercase;
    }
    .sku-fix-input:focus { outline: none; border-color: var(--accent); }
    .sku-fix-go, .sku-fix-skip {
      padding: 10px 18px; font-size: 1.05rem; font-weight: bold;
      border-radius: 8px; cursor: pointer;
    }
    .sku-fix-go { background: var(--accent); color: #fff; border: none; }
    .sku-fix-skip {
      display: block; width: 100%; margin-top: 10px;
      background: transparent; color: var(--text); border: 1px solid var(--muted);
    }
    .sku-fix-msg { min-height: 1.2em; margin-top: 6px; font-size: 0.95rem; font-weight: bold; color: var(--error); }

    /* Quantity entry */
    .qty-panel {
      margin-top: 12px;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .qty-label { text-align: center; color: var(--muted); margin-bottom: 8px; }
    .qty-row { display: flex; gap: 10px; align-items: stretch; }
    .qty-row .qty-display { flex: 1; min-width: 0; }
    .qty-row .save-btn { flex: 0 0 auto; padding: 0 28px; font-size: 1.3rem; font-weight: bold; border-radius: 10px; cursor: pointer; }
    .qty-display {
      text-align: center;
      font-size: 2.6rem;
      font-weight: bold;
      padding: 10px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      min-height: 1.6em;
      letter-spacing: 2px;
    }
    .qty-display.empty { color: var(--border); }
    .qty-display.default { background: #e3eefb; } /* default 1: typing replaces it */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .numpad button {
      padding: 18px 0;
      font-size: 1.6rem;
      font-weight: bold;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
    }
    .numpad button:active { background: #e3eefb; }
    .numpad button.fn { font-size: 1.1rem; color: var(--muted); }
    .qty-actions { display: flex; gap: 10px; margin-top: 12px; }
    .qty-actions button {
      padding: 16px 0;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    .numpad button.quick-key {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      line-height: 1.05; color: var(--ok); background: var(--ok-bg); border-color: var(--ok);
    }
    .quick-key .qk-num { font-weight: bold; }
    .note-btn { flex: 1; background: transparent; border: 1px solid var(--muted); color: var(--text); }
    .skip-btn { flex: 1; background: transparent; border: 1px solid var(--muted); color: var(--text); }
    .save-btn { flex: 2; background: var(--ok); border: none; color: #fff; }
    .save-btn:disabled { opacity: 0.4; cursor: default; }
    .key-hint { margin-top: 10px; text-align: center; font-size: 0.85rem; color: var(--muted); }

    .back-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 18px;
      font-size: 1rem;
      background: transparent;
      border: 1px solid var(--muted);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
    }

    /* Background save status, pinned to the top of the screen */
    #syncBar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 10;
      margin: -24px -16px 12px;
      padding: 10px 16px;
      font-size: 0.95rem;
      text-align: center;
    }
    #syncBar.pending { display: block; background: #eef2f6; color: var(--muted); }
    #syncBar.error { display: block; background: var(--error); color: #fff; text-align: left; }
    #syncBar ul { margin: 6px 0 8px; padding-left: 20px; }
    #syncBar li { margin: 2px 0; }
    #syncBar button {
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      background: #fff;
      color: var(--error);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    #status { margin-top: 18px; min-height: 1.4em; text-align: center; }

    /* Login PIN pad */
    .pin-box { max-width: 340px; margin: 0 auto; }
    .pin-dots {
      display: flex; justify-content: center; align-items: center; gap: 12px;
      height: 44px; margin-bottom: 14px;
    }
    .pin-dots span {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--text);
    }
    .pin-dots .hint { width: auto; height: auto; background: none; color: var(--border); font-size: 1rem; letter-spacing: 0; }
    .pin-dots.shake { animation: pinShake 0.35s; }
    @keyframes pinShake {
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .pin-pad { margin-top: 0; }
    .pin-go {
      display: block; width: 100%; margin-top: 12px; padding: 16px 0;
      font-size: 1.2rem; font-weight: bold; color: #fff;
      background: var(--accent); border: none; border-radius: 10px; cursor: pointer;
    }
    .pin-go:disabled { opacity: 0.4; cursor: default; }
    input[type=password] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      font-size: 1.3rem;
      border: 2px solid var(--border);
      border-radius: 10px;
    }
    input[type=password]:focus { outline: none; border-color: var(--accent); }
    .logout-btn {
      display: block;
      margin: 28px auto 0;
      padding: 6px 12px;
      font-size: 0.9rem;
      background: transparent;
      border: none;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Phone camera scanning */
    /* Barcode box with the camera icon inside it, at the right edge */
    .scan-field { position: relative; flex: 1; min-width: 0; display: flex; }
    .scan-field input { width: 100%; }
    body.touch .scan-field input { padding-right: 54px; }
    .cam-btn {
      display: none; /* shown on touch devices */
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .cam-btn:active { background: #e3eefb; }
    .cam-btn svg { width: 30px; height: 30px; stroke: var(--accent); display: block; }
    body.touch .cam-btn { display: flex; }
    #camOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #111;
      padding: 16px;
      overflow-y: auto;
    }
    #camOverlay.open { display: block; }
    .cam-box { max-width: 520px; margin: 0 auto; }
    #camView {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 65vh;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      container-type: size; /* lets the aim box size itself to the view */
    }
    #camVideo { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Aim box: barcodes are read from this middle band */
    /* Aim box: nearly square (a little wider than tall), centered */
    .cam-guide {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      width: min(84cqw, 96cqh);
      aspect-ratio: 6 / 5;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    #camMsg { margin: 14px 0; min-height: 1.3em; text-align: center; color: #fff; font-size: 1.05rem; }
    #camMsg.ok { color: #a5d6a7; font-weight: bold; }

    /* Quantity pop-up over the camera: the item and number pad move in here,
       then back to the camera for the next scan */
    #camSheet { display: none; }
    #camOverlay.sheet #camMsg { display: none; }
    #camOverlay.sheet { padding: 10px 12px; }
    #camOverlay.sheet #camView { display: none; } /* paused while counting */
    #camOverlay.sheet #camQuick { display: none; }
    .quick-toggle { background: transparent; color: #fff; border: 1px solid #fff; }
    .quick-toggle.on { background: var(--ok); border-color: var(--ok); }
    /* Quick scan on: green frame so it's obvious */
    #camOverlay.quick .cam-guide { border-color: #66bb6a; }
    #camOverlay.quick #camView::after {
      content: 'QUICK SCAN +1';
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      padding: 3px 10px; border-radius: 99px;
      background: var(--ok); color: #fff; font-size: 0.8rem; font-weight: bold; letter-spacing: 0.04em;
    }
    #camOverlay.sheet #camSheet { display: block; margin-top: 6px; }
    #camSheet #scanResult { margin-top: 0; }
    #camSheet .result.found { padding: 5px 10px; }
    #camSheet .qty-panel { margin-top: 6px; padding: 8px 10px; }
    #camSheet .qty-label, #camSheet .key-hint { display: none; }
    #camSheet .qty-display { font-size: 1.6rem; padding: 2px 6px; min-height: 0; }
    #camSheet .qty-row .save-btn { padding: 0 20px; font-size: 1.1rem; }
    #camSheet .numpad { gap: 6px; margin-top: 6px; }
    #camSheet .numpad button { padding: clamp(4px, 1.1vh, 11px) 0; font-size: 1.35rem; }
    #camSheet .numpad button.fn { font-size: 0.95rem; }
    #camSheet .qty-actions { margin-top: 6px; }
    #camSheet .qty-actions button { padding: 8px 0; font-size: 1.05rem; }
    #camOverlay.sheet .cam-actions { margin-top: 6px; }
    #camOverlay.sheet .cam-actions > * { padding: 8px 0; font-size: 1.05rem; }
    .cam-actions { display: flex; gap: 10px; }
    .cam-actions > * {
      flex: 1;
      padding: 16px 0;
      font-size: 1.15rem;
      font-weight: bold;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
    }
    #camClose { background: transparent; color: #fff; border: 1px solid #fff; }
    #status.error { color: var(--error); }

    /* ---------- responsive sizing ----------
     * Sizes scale smoothly with the screen; the rules below adjust for
     * small phones, short (landscape) screens and tablets/computers.
     */
    html { -webkit-text-size-adjust: 100%; }
    input::placeholder { text-transform: none; }
    .wrap {
      max-width: 560px;
      padding: clamp(12px, 3vh, 24px) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    }
    h1 { font-size: clamp(1.3rem, 5vw, 1.7rem); }
    .loc-btn { padding: clamp(22px, 7vh, 40px) 0; font-size: clamp(1.4rem, 7vw, 2.2rem); }
    .numpad button { padding: clamp(10px, 2.6vh, 20px) 0; font-size: clamp(1.3rem, 5vw, 1.7rem); }
    .qty-display { font-size: clamp(1.8rem, 9vw, 2.6rem); padding: clamp(4px, 1.2vh, 10px); }
    .qty-actions button { padding: clamp(10px, 2.2vh, 16px) 0; }
    #syncBar { margin: calc(-1 * clamp(12px, 3vh, 24px)) -16px 12px; }

    /* Small phones */
    @media (max-width: 360px) {
      .loc-buttons { gap: 8px; }
      .go-btn { padding: 0 14px; }
      .qty-row .save-btn { padding: 0 18px; }
      .numpad { gap: 7px; }
      .item-line { font-size: 0.9rem; }
    }

    /* Short screens (phone turned sideways): keep the number pad on screen */
    @media (max-height: 520px) {
      h1 { display: none; }
      .step { margin-top: 8px; }
      .step h2 { margin-bottom: 8px; font-size: 1rem; }
      .numpad { gap: 6px; margin-top: 8px; }
      .qty-panel { padding: 10px; margin-top: 8px; }
      .key-hint { display: none; }
      #camView { aspect-ratio: auto; height: 60vh; }
    }

    /* Tablets and computers: more room */
    @media (min-width: 820px) {
      .wrap { max-width: 900px; }
      #stepLocation, #stepInitials, #stepLogin, #stepZone { max-width: 560px; margin-left: auto; margin-right: auto; }
    }

    /* Tablet portrait: same stacked layout as a phone (quantity pad below
       the item), just a little wider */
    @media (min-width: 820px) and (orientation: portrait) {
      #stepScan { max-width: 620px; margin-left: auto; margin-right: auto; }
    }

    /*
     * Landscape (iPad sideways, computers): the quantity pad is its own panel
     * down the right side (about 20% of the screen); everything else uses the
     * other 80%. The panel shows a hint until an item is scanned.
     */
    :root { --panel-w: max(20vw, 240px); }
    @media (orientation: landscape) and (max-height: 540px) {
      :root { --panel-w: 42vw; }
    }

    @media (min-width: 820px) and (orientation: landscape),
           (orientation: landscape) and (max-height: 540px) {
      body.on-scan .wrap {
        max-width: none;
        margin-right: var(--panel-w);
        padding-left: 24px;
        padding-right: 24px;
      }
      body.on-scan #stepScan { max-width: 720px; margin-left: auto; margin-right: auto; }
      body.on-scan #syncBar { margin-left: -24px; margin-right: -24px; }

      /* the side panel */
      body.on-scan::after,
      body.on-scan #stepScan #qtyPanel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: var(--panel-w);
        margin: 0;
        border-radius: 0;
        border-left: 1px solid var(--border);
        background: var(--card);
      }
      /* empty-state hint behind the pad */
      body.on-scan::after {
        content: 'Scan an item to enter its quantity';
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
        z-index: 1;
      }
      body.on-scan #stepScan #qtyPanel {
        z-index: 2;
        box-shadow: none;
        padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 16px 14px;
        overflow-y: auto;
        flex-direction: column;
        justify-content: center;
      }
      body.on-scan #stepScan #qtyPanel[style*="block"] { display: flex !important; }
      body.on-scan #stepScan .qty-row { flex-direction: column; }
      body.on-scan #stepScan .qty-row .save-btn { padding: 14px 0; font-size: 1.25rem; }
      body.on-scan #stepScan .qty-display { font-size: clamp(1.8rem, 3.6vw, 2.6rem); }
      body.on-scan #stepScan .numpad { gap: 8px; }
      body.on-scan #stepScan .numpad button { padding: clamp(10px, 2.4vh, 18px) 0; font-size: clamp(1.2rem, 2.2vw, 1.6rem); }
      body.on-scan #stepScan .numpad button.fn { font-size: clamp(0.8rem, 1.2vw, 1rem); }
      body.on-scan #stepScan .key-hint { font-size: 0.8rem; }
      /* windows shown over the app stay above the side panel */
      #camOverlay { z-index: 70; }
      #pickModal { z-index: 80; }
    }

    /*
     * Phones on their side: short screen, so everything is compact.
     * Left: pills, SKU box, item, buttons (scrolls if needed).
     * Right (about 40%): quantity and Save on one row, quick count,
     * number pad, Note / Skip, all fitting the height without scrolling.
     */
    @media (orientation: landscape) and (max-height: 540px) {
      body.on-scan .wrap { padding: 8px 16px 24px max(16px, env(safe-area-inset-left)); }
      body.on-scan #syncBar { margin: -8px -16px 8px; }
      body.on-scan #summary { margin: 0 0 4px; }
      body.on-scan #stepScan { margin-top: 4px; }
      body.on-scan #stepScan > h2 { display: none; }
      body.on-scan input[type=text] { padding: 9px 12px; font-size: 1.1rem; }
      body.on-scan #scanResult { margin-top: 2px; }
      body.on-scan .zone-done-btn { margin-top: 10px; padding: 9px 0; font-size: 0.95rem; }
      body.on-scan .back-btn { margin-top: 10px; padding: 7px 16px; }
      body.on-scan .status-link { margin-top: 4px; }
      body.on-scan .recent { margin-top: 10px; }

      body.on-scan #stepScan #qtyPanel {
        justify-content: center;
        padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px 10px;
      }
      /* Quantity panel (scan screen side panel, or the camera's quantity
         screen): small quantity box and Save on one row, keys in
         2 rows of 6, then Note and Skip */
      :is(body.on-scan #stepScan, #camSheet) .qty-label,
      :is(body.on-scan #stepScan, #camSheet) .key-hint { display: none; }
      :is(body.on-scan #stepScan, #camSheet) .qty-row { flex-direction: row; gap: 8px; }
      :is(body.on-scan #stepScan, #camSheet) .qty-display {
        font-size: 1.25rem; padding: 4px 6px; min-height: 0; border-width: 2px; letter-spacing: 1px;
      }
      :is(body.on-scan #stepScan, #camSheet) .qty-row .save-btn { padding: 0 14px; font-size: 1rem; }
      :is(body.on-scan #stepScan, #camSheet) .numpad {
        grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 8px;
      }
      :is(body.on-scan #stepScan, #camSheet) .numpad button {
        padding: clamp(8px, 3.4vh, 16px) 0; font-size: 1.15rem;
      }
      :is(body.on-scan #stepScan, #camSheet) .numpad button.fn { font-size: 0.8rem; }
      /* Landscape key order: 1 2 3 4 5 [expected] / 6 7 8 9 0 ⌫ */
      :is(body.on-scan #stepScan, #camSheet) .numpad > button { order: 3; }
      :is(body.on-scan #stepScan, #camSheet) .numpad > button:nth-child(-n+5) { order: 1; }
      :is(body.on-scan #stepScan, #camSheet) .numpad > #quickKey { order: 2; }
      :is(body.on-scan #stepScan, #camSheet) .numpad button.quick-key { padding: 4px 0; font-size: 0.9rem; }
      :is(body.on-scan #stepScan, #camSheet) .qty-actions { margin-top: 8px; gap: 6px; }
      :is(body.on-scan #stepScan, #camSheet) .qty-actions button { padding: 9px 0; font-size: 1rem; }

      /* camera: use the height, aim box stays near-square */
      #camOverlay { padding: 8px; }
      #camView { aspect-ratio: auto; height: 72vh; max-height: none; }
      #camMsg { margin: 6px 0; }
      .cam-actions > * { padding: 10px 0; }
      .pick-box { margin-top: 2vh; padding: 12px; }

      /* quantity screen over the camera: use the full width */
      #camOverlay.sheet .cam-box { max-width: 640px; }
      #camOverlay.sheet .cam-actions > * { padding: 8px 0; }
      #camSheet .result.found { padding: 6px 10px; }
      #camSheet .qty-panel { margin-top: 6px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="syncBar"></div>
    <h1>Inventory</h1>

    <div id="summary">
      <button type="button" class="chip" id="chipLoc" data-pick="location">Location<b></b></button>
      <button type="button" class="chip" id="chipInit" data-pick="initials">Initials<b></b></button>
      <button type="button" class="chip" id="chipZone" data-pick="zone">Zone<b></b></button>
    </div>

    <!-- Step 0: Login -->
    <div class="step" id="stepLogin">
      <h2>Enter your code</h2>
      <div class="pin-box">
        <div class="pin-dots" id="pinDots" aria-label="Code entered"></div>
        <div class="numpad pin-pad" id="pinPad">
          <button type="button" tabindex="-1" data-k="1">1</button>
          <button type="button" tabindex="-1" data-k="2">2</button>
          <button type="button" tabindex="-1" data-k="3">3</button>
          <button type="button" tabindex="-1" data-k="4">4</button>
          <button type="button" tabindex="-1" data-k="5">5</button>
          <button type="button" tabindex="-1" data-k="6">6</button>
          <button type="button" tabindex="-1" data-k="7">7</button>
          <button type="button" tabindex="-1" data-k="8">8</button>
          <button type="button" tabindex="-1" data-k="9">9</button>
          <button type="button" tabindex="-1" data-k="clear" class="fn">Clear</button>
          <button type="button" tabindex="-1" data-k="0">0</button>
          <button type="button" tabindex="-1" data-k="back" class="fn">&#9003;</button>
        </div>
        <button type="button" class="pin-go" id="loginGo" onclick="submitLogin()" disabled>Log in</button>
      </div>
    </div>

    <!-- Step 1: Location -->
    <div class="step" id="stepLocation">
      <h2>Choose a location</h2>
      <div class="loc-buttons">
        <button class="loc-btn" id="btnFC" onclick="pickLocation('FC')">FC</button>
        <button class="loc-btn" id="btnMH" onclick="pickLocation('MH')">MH</button>
        <button class="loc-btn" id="btnBA" onclick="pickLocation('BA')">BA</button>
      </div>
      <button class="status-link admin-only" onclick="openStatus()">View status</button>
      <button class="logout-btn" style="margin-top:4px" onclick="logOut()">Log out</button>
    </div>

    <!-- Step 2: Initials -->
    <div class="step" id="stepInitials">
      <h2>Enter your initials</h2>
      <div class="input-row">
        <input type="text" id="initialsInput" maxlength="11" autocomplete="off"
               placeholder="e.g. JD or JD/MK" oninput="onInitialsInput()"
               onkeydown="if(event.key==='Enter') submitInitials()">
        <button class="go-btn" id="initialsGo" onclick="submitInitials()" disabled>Next</button>
      </div>
      <button class="back-btn" onclick="showStep('stepLocation')">Back</button>
    </div>

    <!-- Step 3: Zone -->
    <div class="step" id="stepZone">
      <h2>Choose a zone</h2>
      <div class="input-row">
        <input type="text" id="zoneInput" autocomplete="off"
               placeholder="Zone" oninput="renderZones()"
               onkeydown="if(event.key==='Enter') submitTypedZone()">
        <button class="go-btn" onclick="submitTypedZone()">Go</button>
      </div>
      <div id="zoneGrid"></div>
      <div id="zoneEmpty">No matching zones</div>
      <button class="back-btn" onclick="showStep('stepInitials')">Back</button>
    </div>

    <!-- Step 4: Scan + count -->
    <div class="step" id="stepScan">
      <h2>Scan a barcode or type a SKU</h2>
      <div class="input-row">
        <div class="scan-field">
          <input type="text" id="scanInput" autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false" placeholder="SKU"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();submitScan();}">
          <button class="cam-btn" id="camBtn" onclick="openCamera()" aria-label="Scan with camera" title="Scan with camera">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16" stroke-width="1.7"/><path d="M7.2 7.6v3M7.2 13.4v3" stroke-width="1" stroke-linecap="butt"/><path d="M9.1 7.6v3M9.1 13.4v3" stroke-width="1.6" stroke-linecap="butt"/><path d="M11.2 7.6v3M11.2 13.4v3" stroke-width="0.9" stroke-linecap="butt"/><path d="M13 7.6v3M13 13.4v3" stroke-width="1.6" stroke-linecap="butt"/><path d="M15.1 7.6v3M15.1 13.4v3" stroke-width="0.9" stroke-linecap="butt"/><path d="M16.9 7.6v3M16.9 13.4v3" stroke-width="1.3" stroke-linecap="butt"/><path d="M4.6 12h14.8" stroke-width="1.6"/></svg>
          </button>
        </div>
        <button class="go-btn" onclick="submitScan()">Enter</button>
      </div>
      <div class="scan-info">
        <div id="itemsStatus"></div>
        <div id="saveStatus"></div>
        <div id="scanResult"></div>
      </div>

      <div class="qty-panel" id="qtyPanel" style="display:none;">
        <div class="qty-label">Quantity counted</div>
        <div class="qty-row">
          <div class="qty-display empty" id="qtyDisplay">0</div>
          <button tabindex="-1" class="save-btn" id="saveBtn" disabled>Save</button>
        </div>
        <div class="numpad" id="numpad">
          <button tabindex="-1" data-k="1">1</button>
          <button tabindex="-1" data-k="2">2</button>
          <button tabindex="-1" data-k="3">3</button>
          <button tabindex="-1" data-k="4">4</button>
          <button tabindex="-1" data-k="5">5</button>
          <button tabindex="-1" data-k="6">6</button>
          <button tabindex="-1" data-k="7">7</button>
          <button tabindex="-1" data-k="8">8</button>
          <button tabindex="-1" data-k="9">9</button>
          <button tabindex="-1" data-k="quick" id="quickKey" class="fn">Clear</button>
          <button tabindex="-1" data-k="0">0</button>
          <button tabindex="-1" data-k="back" class="fn">&#9003;</button>
        </div>
        <div class="qty-actions">
          <button tabindex="-1" class="note-btn" id="noteBtn">Note</button>
          <button tabindex="-1" class="skip-btn" id="skipBtn">Skip</button>
        </div>
        <div class="key-hint">Enter saves 1, or type a different number first · Esc to skip</div>
      </div>

      <button type="button" class="zone-done-btn" id="zoneDoneBtn" onclick="confirmZoneDone()" style="display:none"></button>
      <button class="back-btn" onclick="backFromScan()">Back</button>
      <button class="status-link admin-only" onclick="openStatus()">View status</button>
      <div class="recent" id="recentList"></div>
    </div>

    <div id="status"></div>
  </div>

  <!-- Window for changing location / initials / zone from the scan screen -->
  <div id="pickModal">
    <div class="pick-box">
      <h2 id="pickTitle"></h2>
      <div id="pickBody"></div>
      <div class="pick-msg" id="pickMsg"></div>
      <button type="button" class="pick-cancel" id="pickCancel">Cancel</button>
    </div>
  </div>

  <!-- Camera scanner (phones / tablets) -->
  <div id="camOverlay">
    <div class="cam-box">
      <div id="camView">
        <video id="camVideo" playsinline muted autoplay></video>
        <div class="cam-guide"></div>
      </div>
      <div id="camMsg"></div>
      <div id="camSheet"></div>
      <div class="cam-actions">
        <button type="button" id="camQuick" class="quick-toggle">Quick scan: Off</button>
        <button id="camClose">Close</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      location: null,
      itemCount: 0,
      zones: null,   // null = this location has no zone step
      done: new Set(), // zones marked complete (upper-case names)
      initials: '',
      zone: null
    };

    /* ---------- helpers ---------- */

    function showStep(id) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      setStatus('');
      // Clear choices made at or after this step
      if (id === 'stepLocation') { state.location = null; state.zone = null; setLocButtonsDisabled(false); }
      if (id === 'stepInitials' || id === 'stepZone') { state.zone = null; }
      if (id !== 'stepScan') { clearCurrent(); closeCamera(false); clearSession(); }
      updateSummary();
      if (id === 'stepInitials') focusLater('initialsInput');
      if (id === 'stepLogin') { pinValue = ''; renderPin(); }
      if (id === 'stepZone') { document.getElementById('zoneInput').value = ''; renderZones(); focusLater('zoneInput'); refreshZoneDone(); }
      // No auto-focus on the scan box: scans are captured anywhere on the
      // screen, and focusing would pop up the phone keyboard.
      if (id === 'stepScan') { updateItemsStatus(); }
    }

    function focusLater(id) {
      setTimeout(() => document.getElementById(id).focus(), 50);
    }

    function setStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = isError ? 'error' : '';
    }

    function setLocButtonsDisabled(d) {
      document.getElementById('btnFC').disabled = d;
      document.getElementById('btnMH').disabled = d;
      document.getElementById('btnBA').disabled = d;
    }

    function updateSummary() {
      const set = (id, val) => {
        const chip = document.getElementById(id);
        chip.style.display = val ? 'inline-block' : 'none';
        chip.querySelector('b').textContent = val || '';
      };
      set('chipLoc', state.location);
      set('chipInit', state.location && state.initials && !isStepActive('stepInitials') ? state.initials : '');
      set('chipZone', state.zone);
      document.getElementById('summary').style.display = state.location ? 'flex' : 'none';
      document.body.classList.toggle('can-change', isStepActive('stepScan'));
      document.body.classList.toggle('on-scan', isStepActive('stepScan'));
      if (isStepActive('stepScan')) renderRecent(); // follows location / initials changes
      const zd = document.getElementById('zoneDoneBtn');
      if (zd) {
        zd.style.display = state.zone ? 'block' : 'none';
        const done = state.zone && isZoneDone(state.zone);
        zd.textContent = done ? '✓ Zone ' + state.zone + ' is complete' : 'Mark zone ' + (state.zone || '') + ' complete';
        zd.classList.toggle('is-done', !!done);
      }
    }

    function isStepActive(id) {
      return document.getElementById(id).classList.contains('active');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* ---------- sounds ---------- */

    let audioCtx = null;

    // Browsers only allow sound after the user has tapped or typed,
    // so the audio is unlocked on the first interaction.
    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('pointerdown', ensureAudio);
    document.addEventListener('keydown', ensureAudio);

    function tone(type, freqStart, freqEnd, start, duration, volume) {
      const t = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqStart, t);
      if (freqEnd !== freqStart) osc.frequency.exponentialRampToValueAtTime(freqEnd, t + duration);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(volume, t + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration + 0.02);
    }

    // Found: short, bright "pop"
    function playPop() {
      ensureAudio();
      if (!audioCtx) return;
      tone('sine', 1000, 350, 0, 0.09, 0.7);
    }

    // Not found / error: one low "donk"
    function playWarning() {
      ensureAudio();
      if (!audioCtx) return;
      tone('square', 180, 130, 0, 0.3, 0.35);
    }

    /* ---------- background preload ---------- */

    /* ---------- talking to the sheet ----------
     * Inside Apps Script the app uses google.script.run. When this same page
     * is opened on its own (outside Google's frame, so the live camera works)
     * it calls the Apps Script web app at API_URL instead.
     * Every call carries the password, which the sheet checks.
     */
    const API_URL = 'https://script.google.com/macros/s/AKfycbyxtI6PT40vcf1em5DV6QGqmRVSsMDiqRm9WCz0bpki3l7FHyvPtJMxWiOX92L2Jm5t/exec';
    const inAppsScript = !!(window.google && google.script && google.script.run);

    let password = '';
    try { password = localStorage.getItem('inv_pass') || ''; } catch (e) {}

    function isLoginError(err) {
      return /LOGIN_REQUIRED/.test(err && err.message || '');
    }

    function callServer(fn, ...args) {
      return new Promise((resolve, reject) => {
        if (inAppsScript) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[fn](...args, password);
          return;
        }
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
          body: JSON.stringify({ action: fn, args: args, pass: password })
        })
          .then(r => r.json())
          .then(j => { if (!j.ok) throw new Error(j.error || 'Server error'); resolve(j.data); })
          .catch(err => {
            const msg = err && err.message && !/fetch|network|load failed|json/i.test(err.message)
              ? err.message : 'Connection problem';
            reject(new Error(msg));
          });
      });
    }

    // Same style as google.script.run: runServer().withSuccessHandler(..).getItems(loc)
    function runServer() {
      let onOk = () => {}, onFail = () => {};
      const go = (fn, ...a) => callServer(fn, ...a).then(
        d => onOk(d),
        err => { if (isLoginError(err)) loginExpired(); onFail(err); }
      );
      return {
        withSuccessHandler(f) { onOk = f; return this; },
        withFailureHandler(f) { onFail = f; return this; },
        getAppData() { go('getAppData'); },
        getItems(loc) { go('getItems', loc); },
        saveCounts(entries) { go('saveCounts', entries); }
      };
    }

    /* ---------- login ---------- */

    // Login type from the Login sheet (column B). Admins can view the status.
    let userType = '';
    try { userType = localStorage.getItem('inv_type') || ''; } catch (e) {}
    function applyUserType(t) {
      userType = t || '';
      try { localStorage.setItem('inv_type', userType); } catch (e) {}
      document.body.classList.toggle('is-admin', userType.toLowerCase() === 'admin');
    }
    applyUserType(userType);

    /* ---------- login PIN pad ----------
     * Tap the keys, or type on a keyboard (Enter logs in, Backspace deletes).
     */
    let pinValue = '';
    const PIN_MAX = 12;

    function renderPin() {
      const dots = document.getElementById('pinDots');
      dots.innerHTML = pinValue
        ? '<span></span>'.repeat(pinValue.length)
        : '<span class="hint">Code</span>';
      document.getElementById('loginGo').disabled = !pinValue;
    }

    function pinKey(k) {
      if (checkingLogin) return; // wait while the code is being checked
      if (k === 'clear') pinValue = '';
      else if (k === 'back') pinValue = pinValue.slice(0, -1);
      else if (pinValue.length < PIN_MAX) pinValue += k;
      setStatus('');
      renderPin();
    }

    const pinPadEl = document.getElementById('pinPad');
    pinPadEl.addEventListener('mousedown', e => e.preventDefault());
    pinPadEl.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) pinKey(b.dataset.k);
    });
    document.addEventListener('keydown', e => {
      if (!isStepActive('stepLogin') || e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.key === 'Enter') { e.preventDefault(); if (pinValue) submitLogin(); return; }
      if (e.key === 'Backspace') { e.preventDefault(); pinKey('back'); return; }
      if (e.key === 'Escape') { pinKey('clear'); return; }
      if (e.key.length === 1 && /\S/.test(e.key)) { e.preventDefault(); pinKey(e.key); }
    });

    let checkingLogin = false;

    function submitLogin() {
      if (checkingLogin) return;
      const val = pinValue.trim();
      if (!val) { setStatus('Enter your code.', true); return; }
      checkingLogin = true;
      const btn = document.getElementById('loginGo');
      btn.disabled = true;
      setStatus('Checking…');
      password = val;
      // Quick check only; everything else loads afterwards in the background
      callServer('login')
        .then(res => {
          applyUserType(res && res.type);
          checkingLogin = false;
          btn.disabled = false;
          setStatus('');
          try { localStorage.setItem('inv_pass', password); } catch (e) {}
          pinValue = '';
          renderPin();
          showStep('stepLocation');
          appData = null;
          loadAppData();
          startHeadStart();
          if (saveQueue.length) { retryDelay = 0; netError = ''; sendQueue(); }
        })
        .catch(err => {
          checkingLogin = false;
          password = '';
          if (isLoginError(err)) {
            setStatus('Wrong code. Try again.', true);
            playWarning();
            pinValue = '';
            const dots = document.getElementById('pinDots');
            dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
          } else {
            setStatus(err.message, true);
          }
          renderPin();
        });
    }

    // The saved password stopped working (changed on the Login sheet)
    function loginExpired() {
      if (isStepActive('stepLogin')) return;
      applyUserType('');
      password = '';
      try { localStorage.removeItem('inv_pass'); } catch (e) {}
      appData = null;
      showStep('stepLogin');
      setStatus('Please log in again.', true);
    }

    function logOut() {
      closeCamera(false, true);
      applyUserType('');
      password = '';
      try { localStorage.removeItem('inv_pass'); } catch (e) {}
      appData = null;
      items.location = null; items.index = null; items.rows = []; items.loading = false;
      showStep('stepLogin');
    }

    let appData = null;       // filled by getAppData()
    let appDataFailed = false;
    let pendingLoc = null;    // location tapped before data arrived

    function loadAppData() {
      appDataFailed = false;
      runServer()
        .withSuccessHandler(d => {
          appData = d;
          if (pendingLoc) { const l = pendingLoc; pendingLoc = null; pickLocation(l); }
          // Resumed straight onto the scan screen: finish setting up that location
          if (state.location && isStepActive('stepScan')) {
            const info = d[state.location];
            if (!info || info.error) {
              showStep('stepLocation');
              setStatus(info ? info.error : 'Unknown location', true);
            } else {
              state.zones = info.zones;
              state.done = new Set((info.done || []).map(z => z.toUpperCase()));
              state.itemCount = info.itemCount;
            }
          }
        })
        .withFailureHandler(err => {
          appDataFailed = true;
          if (pendingLoc) {
            pendingLoc = null;
            setLocButtonsDisabled(false);
            setStatus(err.message, true);
          }
        })
        .getAppData();
    }

    // Item list for the chosen location, loaded while initials/zone are entered
    const items = {
      location: null,
      loading: false,
      error: null,
      headers: [],
      rows: [],
      counts: [],
      index: null      // normalized barcode -> array of row indexes
    };
    let pendingScan = null; // barcode scanned before items finished loading

    // Barcodes compare case-insensitively; numeric codes ignore leading zeros
    function normCode(c) {
      c = String(c).trim().toUpperCase();
      if (/^\d+$/.test(c)) c = c.replace(/^0+(?=\d)/, '');
      return c;
    }

    /*
     * Splits a barcode cell into its barcodes. Handles cells like
     *   "057543841072; 57543841072"   "GTIN: 0123…, UPC:0456…"
     * Separators: ; , | or spaces. Labels such as "GTIN:" or "UPC:" in front
     * of a barcode are ignored.
     */
    function splitBarcodes(cell) {
      return String(cell)
        .replace(/[A-Za-z][A-Za-z ]*:/g, ' ')   // drop labels like GTIN: / UPC:
        .split(/[;,|\s]+/)
        .map(c => c.trim())
        .filter(Boolean);
    }

    function loadItems(loc) {
      if (items.location === loc && (items.index || items.loading)) return;
      items.location = loc;
      items.loading = true;
      items.error = null;
      items.index = null;
      updateItemsStatus();

      runServer()
        .withSuccessHandler(json => {
          if (items.location !== loc) return; // location changed meanwhile
          const d = typeof json === 'string' ? JSON.parse(json) : json;
          const index = new Map();
          // A barcode cell may hold several barcodes; every one of them
          // points to the same item
          d.codes.forEach((cell, i) => {
            if (!cell) return;
            splitBarcodes(cell).forEach(code => {
              const key = normCode(code);
              if (!key) return;
              if (!index.has(key)) index.set(key, []);
              const list = index.get(key);
              if (list[list.length - 1] !== i) list.push(i);
            });
          });
          items.rows = d.rows;
          items.codes = d.codes;
          // SKU lookup, for typing a SKU instead of scanning
          const skuIndex = new Map();
          d.rows.forEach((r, i) => {
            if (!r[0]) return;
            const key = normCode(r[0]);
            if (!skuIndex.has(key)) skuIndex.set(key, []);
            skuIndex.get(key).push(i);
          });
          items.skuIndex = skuIndex;
          // Variants of the same product (same title)
          const byTitle = new Map();
          d.rows.forEach((r, i) => {
            const t = String(r[4] || '').toUpperCase();
            if (!t) return;
            if (!byTitle.has(t)) byTitle.set(t, []);
            byTitle.get(t).push(i);
          });
          items.byTitle = byTitle;
          items.counts = d.counts;
          items.index = index;
          items.loading = false;
          updateItemsStatus();
          if (pendingScan) { const c = pendingScan; pendingScan = null; lookup(c); }
        })
        .withFailureHandler(err => {
          if (items.location !== loc) return;
          items.loading = false;
          items.error = err.message;
          updateItemsStatus();
          if (pendingScan) {
            pendingScan = null;
            showResultError('Could not load items: ' + err.message);
          }
        })
        .getItems(loc);
    }

    function updateItemsStatus() {
      const el = document.getElementById('itemsStatus');
      if (items.loading) el.textContent = 'Loading items…';
      else if (items.error) el.textContent = 'Could not load items (' + items.error + '). Go back and pick the location again.';
      else el.textContent = '';
    }

    /* ---------- step 1: location ---------- */

    function pickLocation(loc) {
      // Data still on its way: wait for it, then continue automatically
      if (!appData) {
        if (appDataFailed) loadAppData(); // retry after an earlier failure
        pendingLoc = loc;
        setLocButtonsDisabled(true);
        setStatus('Loading ' + loc + '…');
        return;
      }

      const info = appData[loc];
      if (!info || info.error) {
        setLocButtonsDisabled(false);
        setStatus(info ? info.error : 'Unknown location: ' + loc, true);
        // Refresh in the background in case the sheet is created now
        appData = null;
        loadAppData();
        return;
      }

      state.location = info.location;
      state.itemCount = info.itemCount;
      state.zones = info.zones;
      state.done = new Set((info.done || []).map(z => z.toUpperCase()));

      // Start loading this location's barcodes now, in the background
      // (often already loading, see the bottom of this script)
      if (items.error) items.location = null; // allow a retry
      loadItems(loc);
      try { localStorage.setItem('inv_last_loc', loc); } catch (e) {}

      // Pre-fill initials remembered on this device
      let saved = '';
      try { saved = localStorage.getItem('inv_initials') || ''; } catch (e) {}
      document.getElementById('initialsInput').value = state.initials || saved;
      onInitialsInput();
      showStep('stepInitials');
    }

    /* ---------- step 2: initials ---------- */

    // Letters and "/" allowed, e.g. JD or JD/MK
    function cleanInitials(v) {
      return v.toUpperCase()
              .replace(/[^A-Z\/]/g, '')
              .replace(/\/{2,}/g, '/');
    }

    function letterCount(v) {
      return v.replace(/[^A-Z]/g, '').length;
    }

    function onInitialsInput() {
      const el = document.getElementById('initialsInput');
      el.value = cleanInitials(el.value);
      document.getElementById('initialsGo').disabled = letterCount(el.value) < 2;
    }

    function submitInitials() {
      const val = cleanInitials(document.getElementById('initialsInput').value)
                    .replace(/^\/+|\/+$/g, ''); // no leading/trailing "/"
      document.getElementById('initialsInput').value = val;
      if (letterCount(val) < 2) { setStatus('Please enter at least 2 letters.', true); return; }
      state.initials = val;
      try { localStorage.setItem('inv_initials', val); } catch (e) {}

      if (state.zones) {
        showStep('stepZone');
      } else {
        goToScan();
      }
    }

    /* ---------- step 3: zone ---------- */

    function isZoneDone(z) { return state.done.has(String(z).toUpperCase()); }

    // Zone buttons: zones still to do first, completed ones after with a tick
    function zoneButtonsHtml(list, current) {
      const todo = list.filter(z => !isZoneDone(z));
      const done = list.filter(z => isZoneDone(z));
      return todo.concat(done).map(z =>
        '<button type="button" class="zone-btn' + (isZoneDone(z) ? ' done' : '') +
        (z === current ? ' current' : '') + '" data-zone="' + escapeHtml(z) + '">' +
        escapeHtml(z) + '</button>'
      ).join('');
    }

    function renderZones() {
      const typed = document.getElementById('zoneInput').value.trim().toUpperCase();
      const list = (state.zones || []).filter(z => z.toUpperCase().includes(typed));
      document.getElementById('zoneGrid').innerHTML = zoneButtonsHtml(list, null);
      document.getElementById('zoneEmpty').style.display = list.length ? 'none' : 'block';
    }

    // One click handler for all zone buttons
    document.getElementById('zoneGrid').addEventListener('click', e => {
      const btn = e.target.closest('.zone-btn');
      if (btn) chooseZone(btn.dataset.zone);
    });

    function submitTypedZone() {
      const typed = document.getElementById('zoneInput').value.trim().toUpperCase();
      if (!typed) { setStatus('Type a zone or tap one below.', true); return; }
      const exact = (state.zones || []).find(z => z.toUpperCase() === typed);
      if (exact) { chooseZone(exact); return; }

      const matches = (state.zones || []).filter(z => z.toUpperCase().includes(typed));
      if (matches.length === 1) { chooseZone(matches[0]); return; }
      setStatus(matches.length ? 'More than one zone matches. Tap the one you want.'
                               : '"' + typed + '" is not in the zone list.', true);
    }

    function chooseZone(zone) {
      state.zone = zone;
      goToScan();
    }

    /* ---------- step 4: scan ---------- */

    // The found item waiting for a quantity: { index, code, qty: '' }
    let current = null;

    function goToScan() {
      document.getElementById('scanInput').value = '';
      document.getElementById('scanResult').innerHTML = '';
      setSaveStatus('');
      showStep('stepScan');
      updateSummary();
      saveSession();
      renderRecent();
      refreshZoneDone();
    }

    /*
     * Resume where you left off: the location, initials and zone are kept on
     * the device while you're on the scan screen, so reopening the app (e.g.
     * from a home-screen shortcut) goes straight back to scanning. Going back
     * a step, logging out, or 12 hours passing starts fresh.
     */
    const SESSION_KEY = 'inv_session';
    const SESSION_MAX_AGE = 12 * 60 * 60 * 1000;

    function saveSession() {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          loc: state.location, initials: state.initials, zone: state.zone, t: Date.now()
        }));
      } catch (e) {}
    }

    function clearSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    function readSession() {
      try {
        const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (!sess || !sess.loc || !sess.initials) return null;
        if (Date.now() - sess.t > SESSION_MAX_AGE) return null;
        if (['FC', 'MH', 'BA'].indexOf(sess.loc) === -1) return null;
        return sess;
      } catch (e) { return null; }
    }

    function backFromScan() {
      showStep(state.zones ? 'stepZone' : 'stepInitials');
    }

    // Barcode typed into the bar and submitted with Enter or the button
    function submitScan() {
      const input = document.getElementById('scanInput');
      const code = input.value.trim();
      input.value = '';
      input.blur(); // hand keystrokes back to the screen-wide capture
      handleCode(code);
    }

    // The same barcode scanned again within this time is treated as an
    // accidental double scan and ignored
    const DOUBLE_SCAN_MS = 2000;
    let lastScan = { key: '', time: 0 };

    function handleCode(code) {
      if (!code) return;
      const key = normCode(code);
      const now = Date.now();
      if (key === lastScan.key && now - lastScan.time < DOUBLE_SCAN_MS) {
        lastScan.time = now; // keep ignoring while it keeps repeating
        return;
      }
      lastScan = { key: key, time: now };
      if (!items.index) {
        if (items.error) {
          showResultError('Could not load items: ' + items.error);
          playWarning();
          return;
        }
        // Still loading: look it up as soon as the list arrives
        pendingScan = code;
        clearCurrent();
        document.getElementById('scanResult').innerHTML =
          '<div class="result"><h3>Loading items…</h3>' +
          '<div class="note">' + escapeHtml(code) + ' will be checked as soon as loading finishes.</div></div>';
        return;
      }
      lookup(code);
    }

    function lookup(code) {
      // Barcode first; if no barcode matches, try it as a SKU
      const key = normCode(code);
      const matches = items.index.get(key) || (items.skuIndex && items.skuIndex.get(key));
      const box = document.getElementById('scanResult');

      // A new scan while an item still needs a quantity skips that item
      if (current) setSaveStatus('Previous item was not saved', 'warn');

      if (!matches) {
        playWarning();
        clearCurrent();
        showNotFound(code);
        return;
      }

      playPop();
      showItem(matches[0], code, matches.length);
    }

    // Found item: the green box plus the quantity pad
    function showItem(idx, code, matchCount) {
      const box = document.getElementById('scanResult');
      const [sku, desc, price, expected] = items.rows[idx];
      const counted = items.counts[idx] === '' || items.counts[idx] == null ? '0' : items.counts[idx];
      const note = matchCount > 1
        ? '<div class="note">This barcode matches ' + matchCount + ' items. The count goes on the first one.</div>'
        : '';
      box.innerHTML =
        '<div class="result found">' +
          '<div class="item-line">' +
            '<span class="nowrap">' + escapeHtml(sku) + '</span> ' +
            '<span class="item-desc">' + escapeHtml(desc) + '</span> ' +
            '<span class="nowrap">' + escapeHtml(price) + '</span>' +
          '</div>' +
          '<div class="item-line counts">' +
            '<span>Expected <b>' + escapeHtml(expected || '0') + '</b></span>' +
            '<span>Counted So Far <b>' + escapeHtml(counted) + '</b></span>' +
          '</div>' +
          note +
        '</div>';

      // Quantity starts at 1; the first digit typed replaces it
      current = { index: idx, code: code, sku: items.rows[idx][0], qty: '1', fresh: true };
      document.getElementById('qtyPanel').style.display = 'block';
      renderQty();
      renderQuick();
    }

    /*
     * Barcode not found: set the item aside, or look it up by SKU.
     * A SKU match counts the item as usual and records the SKU and the
     * scanned barcode on the "Barcode Update" sheet.
     */
    function showNotFound(code) {
      const box = document.getElementById('scanResult');
      box.innerHTML =
        '<div class="result notfound">' +
          '<h3>Barcode Not Found</h3>' +
          '<div class="sku-fix-prompt">Enter the SKU to find the item:</div>' +
          '<div class="sku-fix">' +
            '<input type="text" class="sku-fix-input" inputmode="numeric" autocomplete="off" placeholder="SKU">' +
            '<button class="sku-fix-go">Find</button>' +
          '</div>' +
          '<div class="sku-fix-msg"></div>' +
          '<button class="sku-fix-skip">Skip</button>' +
        '</div>';
      box.querySelector('.sku-fix').dataset.code = code;
      // On a computer, put the cursor straight in the SKU box
      if (!isTouch) setTimeout(() => { const i = box.querySelector('.sku-fix-input'); if (i) i.focus(); }, 30);
    }

    {
      const res = document.getElementById('scanResult');
      res.addEventListener('click', e => {
        if (e.target.closest('.sku-fix-go')) findBySku();
        if (e.target.closest('.sku-fix-skip')) skipNotFound();
      });
      // Typing speed in the SKU box: a scanner types far faster than a person,
      // so a fast burst ending in Enter is a new barcode, not a SKU.
      let skuBurst = null;
      res.addEventListener('keydown', e => {
        if (!e.target.classList.contains('sku-fix-input')) return;
        const now = performance.now();
        if (e.key === 'Enter') {
          e.preventDefault();
          const b = skuBurst;
          skuBurst = null;
          const val = e.target.value.trim();
          const isScan = b && b.n >= 4 && now - b.last < 150 && (b.last - b.start) / (b.n - 1) < 40;
          if (isScan && val) {
            e.target.value = '';
            e.target.blur();
            document.getElementById('scanResult').innerHTML = '';
            handleCode(val);
          } else {
            findBySku();
          }
          return;
        }
        if (e.key.length !== 1) return;
        if (!skuBurst || now - skuBurst.last > 100) skuBurst = { start: now, last: now, n: 0 };
        skuBurst.n++;
        skuBurst.last = now;
      });
    }

    function findBySku() {
      const box = document.getElementById('scanResult');
      const wrap = box.querySelector('.sku-fix');
      if (!wrap) return;
      const input = wrap.querySelector('.sku-fix-input');
      const msg = box.querySelector('.sku-fix-msg');
      const sku = input.value.trim();
      if (!sku) { msg.textContent = 'Enter a SKU.'; return; }
      const matches = items.skuIndex && items.skuIndex.get(normCode(sku));
      if (!matches) {
        // Neither the barcode nor the SKU was found
        playWarning();
        msg.textContent = 'SKU not found. Set item aside for review.';
        wrap.dataset.skuFailed = '1';
        input.select();
        return;
      }

      const idx = matches[0];
      const code = wrap.dataset.code;
      input.blur();

      // From now on this barcode finds the item on this device
      const key = normCode(code);
      if (key && !items.index.has(key)) items.index.set(key, [idx]);

      // Record it on the "Barcode Update" sheet (sent in the background)
      queueEntry({
        type: 'link',
        loc: state.location,
        sku: items.rows[idx][0],
        desc: items.rows[idx][1],
        code: code
      });

      playPop();
      showItem(idx, code, 1);
    }

    function skipNotFound() {
      const wrap = document.querySelector('#scanResult .sku-fix');
      const failed = wrap && wrap.dataset.skuFailed === '1';
      document.getElementById('scanResult').innerHTML = '';
      setSaveStatus(failed ? 'Set aside for review' : 'Skipped', 'warn');
      reopenCameraIfUsing();
    }

    function showResultError(msg) {
      clearCurrent();
      document.getElementById('scanResult').innerHTML =
        '<div class="result notfound"><h3>Error</h3><div>' + escapeHtml(msg) + '</div></div>';
    }

    /* ---------- quantity entry ---------- */

    // Quick count: one tap when the shelf matches what's expected.
    // Saves what's still expected here (expected minus counted so far).
    function remainingExpected(idx) {
      const exp = Number(String(items.rows[idx][3]).replace(/,/g, '')) || 0;
      return exp - (Number(items.counts[idx]) || 0);
    }

    // The key where Clear used to be shows the expected quantity; one tap
    // saves it. With nothing more expected it goes back to being Clear.
    function renderQuick() {
      const key = document.getElementById('quickKey');
      const left = current ? remainingExpected(current.index) : 0;
      if (left > 0) {
        key.className = 'quick-key';
        key.innerHTML = '<span class="qk-num">' + left + '</span>';
        key.title = 'Count matches expected: save ' + left;
      } else {
        key.className = 'fn';
        key.textContent = 'Clear';
        key.title = '';
      }
    }

    function quickCount() {
      if (!current) return;
      const left = remainingExpected(current.index);
      if (left <= 0) return;
      current.qty = String(left);
      current.fresh = false;
      current.variantOk = true; // matches expected, so no variant check needed
      renderQty();
      saveCurrent();
    }

    const QTY_MAX_DIGITS = 6;

    function renderQty() {
      const el = document.getElementById('qtyDisplay');
      const q = current ? current.qty : '';
      el.textContent = q === '' ? '0' : q;
      el.classList.toggle('empty', q === '');
      el.classList.toggle('default', !!(current && current.fresh));
      document.getElementById('saveBtn').disabled = q === '';
    }

    function numpadKey(k) {
      if (!current) return;
      if (k === 'clear') { current.qty = ''; current.fresh = false; }
      else if (k === 'back') { current.qty = current.fresh ? '' : current.qty.slice(0, -1); current.fresh = false; }
      else if (/^\d$/.test(k)) {
        if (current.fresh) { current.qty = k; current.fresh = false; } // replace the default 1
        else if (current.qty.length < QTY_MAX_DIGITS) {
          current.qty = (current.qty === '0' ? '' : current.qty) + k; // no leading zeros
        }
      }
      renderQty();
    }

    // Numpad buttons never take focus, so the keyboard/scanner keep working
    const numpadEl = document.getElementById('numpad');
    numpadEl.addEventListener('mousedown', e => e.preventDefault());
    numpadEl.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.k === 'quick') {
        if (current && remainingExpected(current.index) > 0) quickCount();
        else numpadKey('clear');
        return;
      }
      numpadKey(b.dataset.k);
    });
    ['saveBtn', 'skipBtn'].forEach(id =>
      document.getElementById(id).addEventListener('mousedown', e => e.preventDefault()));
    document.getElementById('saveBtn').addEventListener('click', () => saveCurrent());
    document.getElementById('noteBtn').addEventListener('mousedown', e => e.preventDefault());
    document.getElementById('noteBtn').addEventListener('click', openNote);
    document.getElementById('skipBtn').addEventListener('click', () => {
      clearCurrent();
      document.getElementById('scanResult').innerHTML = '';
      setSaveStatus('Skipped', 'warn');
      reopenCameraIfUsing();
    });

    function clearCurrent() {
      current = null;
      document.getElementById('qtyPanel').style.display = 'none';
    }

    function setSaveStatus(msg, kind) {
      const el = document.getElementById('saveStatus');
      el.textContent = msg || '';
      el.className = kind || '';
    }

    /* ---------- background saving ----------
     *
     * Saving never makes you wait. Each count goes into a queue that is
     * kept on this device (so it survives a refresh or a dropped signal)
     * and is sent to the sheet in the background. Counts that pile up while
     * a save is running are sent together in one call.
     *
     * If the sheet can't be reached, the app keeps retrying automatically
     * and shows a red warning. If the sheet rejects a count, the app beeps
     * and lists it in the red warning until you dismiss it.
     */
    const QUEUE_KEY = 'inv_save_queue';
    const BATCH_SIZE = 50;
    let saveQueue = readQueue(); // waiting to be sent
    let failedSaves = [];        // rejected by the sheet: [{ entry, error }]
    let sending = false;
    let retryTimer = null;
    let retryDelay = 0;
    let netError = '';           // set while the sheet can't be reached

    function readQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; }
    }
    function writeQueue() {
      try { localStorage.setItem(QUEUE_KEY, JSON.stringify(saveQueue)); } catch (e) {}
    }

    /*
     * Variant check: if the new total for this variant is above what's
     * expected for it, but no more than 3 above what's expected for ALL
     * variants of the product combined, items of another variant may have
     * been counted as this one. Ask the counter to confirm first.
     * e.g. expected 2 Medium, 3 Large, 1 Extra Large (6 total):
     *      3–9 Medium asks to confirm, 10 or more doesn't.
     */
    function variantCheck(item) {
      const row = items.rows[item.index];
      if (!row || !items.byTitle) return null;
      const family = items.byTitle.get(String(row[4] || '').toUpperCase()) || [];
      if (family.length < 2) return null;
      const exp = i => Number(String(items.rows[i][3]).replace(/,/g, '')) || 0;
      const newTotal = (Number(items.counts[item.index]) || 0) + Number(item.qty);
      const familyExpected = family.reduce((sum, i) => sum + exp(i), 0);
      if (newTotal <= exp(item.index) || newTotal > familyExpected + 3) return null;
      return family.filter(i => exp(i) > 0).map(i => ({
        qty: exp(i),
        label: items.rows[i][5] || items.rows[i][1],
        current: i === item.index
      }));
    }

    let pendingAfterCheck = null; // scan waiting behind a variant check

    function showVariantCheck(list) {
      playWarning();
      openPick('Please confirm that all products are the same variant',
        '<div style="text-align:center;margin-bottom:6px;color:var(--muted)">Expected:</div>' +
        '<div style="text-align:center;font-size:1.15rem;line-height:1.6;margin-bottom:16px">' +
          list.map(v => (v.current ? '<b>' : '') + v.qty + ' ' + escapeHtml(v.label) + (v.current ? '</b>' : '')).join('<br>') +
        '</div>' +
        '<button type="button" class="save-btn" id="variantSaveAnyway" style="width:100%;padding:16px 0;font-size:1.15rem;font-weight:bold;border-radius:10px;cursor:pointer">They\'re all the same. Save</button>');
      document.getElementById('pickCancel').textContent = 'Go back';
      document.getElementById('variantSaveAnyway').addEventListener('click', () => {
        const next = pendingAfterCheck;
        if (current) current.variantOk = true;
        closePick();
        saveCurrent({ fromScan: !!next });
        if (next) lookup(next); // the scan that was waiting
      });
    }

    function saveCurrent(opts) {
      opts = opts || {};
      if (!current) return;
      if (current.qty === '') { setSaveStatus('Enter a quantity first', 'error'); return; }
      if (!current.variantOk) {
        const list = variantCheck(current);
        if (list) { showVariantCheck(list); return; }
      }

      const item = current;
      const qty = Number(item.qty);
      if (quickMode && camOpen()) quickVariantOk.add(item.index); // confirmed once: don't ask again
      const total = recordCount(item.index, item.code, qty);

      // Clear the screen right away so the next item can be scanned
      clearCurrent();
      document.getElementById('scanResult').innerHTML = '';
      setSaveStatus('✓ Counted ' + qty + ' · Total ' + total, 'ok');
      if (!opts.fromScan) reopenCameraIfUsing();
    }

    // Queues one count for the sheet and updates this device right away.
    // Returns the new total for the item.
    function recordCount(index, code, qty) {
      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        loc: state.location,
        index: index,
        sku: items.rows[index][0],
        code: code,
        qty: qty,
        zone: state.zone || '',
        initials: state.initials
      };
      // Update "Counted so far" on this device right away
      if (items.location === entry.loc) {
        items.counts[index] = String((Number(items.counts[index]) || 0) + qty);
      }
      saveQueue.push(entry);
      writeQueue();
      addRecent(index, qty);
      renderSyncBar();
      sendQueue();
      return items.counts[index];
    }

    // Adds any other write (e.g. a barcode link) to the same background queue
    function queueEntry(entry) {
      entry.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      saveQueue.push(entry);
      writeQueue();
      renderSyncBar();
      sendQueue();
    }

    function sendQueue() {
      if (sending || !saveQueue.length) return;
      clearTimeout(retryTimer);
      retryTimer = null;
      sending = true;
      const batch = saveQueue.slice(0, BATCH_SIZE);
      renderSyncBar();

      runServer()
        .withSuccessHandler(results => {
          sending = false;
          retryDelay = 0;
          netError = '';
          const sent = new Set(batch.map(e => e.id));
          saveQueue = saveQueue.filter(e => !sent.has(e.id));
          writeQueue();

          let anyFailed = false;
          results.forEach((r, i) => {
            const e = batch[i];
            if (!r || r.error) {
              anyFailed = true;
              failedSaves.push({ entry: e, error: r ? r.error : 'No response' });
              // Undo the on-device total for a count that didn't save
              if (!e.type && items.location === e.loc) {
                items.counts[e.index] = String(Math.max((Number(items.counts[e.index]) || 0) - e.qty, 0));
              }
            } else if (!e.type && items.location === e.loc &&
                       !saveQueue.some(q => !q.type && q.loc === e.loc && q.index === e.index)) {
              // Use the sheet's total (includes other devices' counts)
              items.counts[e.index] = String(r.total);
            }
          });
          if (anyFailed) playWarning();

          renderSyncBar();
          if (saveQueue.length) sendQueue();
        })
        .withFailureHandler(err => {
          sending = false;
          if (isLoginError(err)) {
            netError = 'Log in again to finish saving';
            renderSyncBar();
            return; // sent again after logging in
          }
          const firstFailure = !netError;
          netError = err.message || 'Connection problem';
          if (firstFailure) playWarning();
          // Retry: 2s, 4s, 8s, 16s, then every 30s
          retryDelay = Math.min(retryDelay ? retryDelay * 2 : 2000, 30000);
          retryTimer = setTimeout(sendQueue, retryDelay);
          renderSyncBar();
        })
        .saveCounts(batch);
    }

    function renderSyncBar() {
      const bar = document.getElementById('syncBar');
      const n = saveQueue.length;
      const plural = (k, w) => k + ' ' + w + (k === 1 ? '' : 's');

      if (failedSaves.length || netError) {
        let html = '';
        if (failedSaves.length) {
          html += '<b>⚠ ' + plural(failedSaves.length, 'count') + ' could not be saved</b><ul>' +
            failedSaves.map(f =>
              '<li>' + escapeHtml(f.entry.code) +
              (f.entry.type === 'link' ? ' · SKU ' + escapeHtml(f.entry.sku) + ' (barcode update)'
               : f.entry.type === 'zone' ? ' (zone complete)'
               : f.entry.type === 'note' ? ' (note)'
               : ' · qty ' + f.entry.qty) +
              (f.entry.zone ? ' · zone ' + escapeHtml(f.entry.zone) : '') +
              ' — ' + escapeHtml(f.error) + '</li>').join('') +
            '</ul>';
        }
        if (netError && n) {
          html += '<div><b>⚠ Can\'t connect right now.</b> ' + plural(n, 'count') +
                  ' waiting — retrying automatically. Don\'t close this page.</div>' +
                  '<div style="margin-top:8px;"><button id="retryNowBtn">Retry now</button>';
        } else {
          html += '<div>';
        }
        if (failedSaves.length) html += '<button id="dismissFailedBtn">Dismiss</button>';
        html += '</div>';
        bar.innerHTML = html;
        bar.className = 'error';
      } else if (n) {
        bar.textContent = 'Saving ' + plural(n, 'count') + '…';
        bar.className = 'pending';
      } else {
        bar.textContent = '';
        bar.className = '';
      }
    }

    document.getElementById('syncBar').addEventListener('mousedown', e => e.preventDefault());
    document.getElementById('syncBar').addEventListener('click', e => {
      if (e.target.id === 'dismissFailedBtn') { failedSaves = []; renderSyncBar(); }
      if (e.target.id === 'retryNowBtn') { retryDelay = 0; sendQueue(); }
    });

    // Try again as soon as the device is back online
    window.addEventListener('online', () => { retryDelay = 0; sendQueue(); });
