    // Warn before closing the page with counts still unsent
    // (they're kept on this device and resume next time the app opens)
    window.addEventListener('beforeunload', e => {
      if (saveQueue.length) { e.preventDefault(); e.returnValue = ''; }
    });

    /*
     * Keyboard and scanner input anywhere on the scan screen.
     *
     * - No item waiting: keystrokes build a barcode; Enter/Tab looks it up.
     * - Item waiting for a quantity: digits go into the quantity, Enter saves,
     *   Backspace deletes, Esc skips. A scanner types much faster than a person,
     *   so a fast burst ending in Enter is treated as a new barcode instead.
     */
    let scanBuffer = '';
    let scanBufferTimer = null;
    let burst = null; // { chars, start, last, qtyBefore, nonDigit }

    function isEditable(el) {
      return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
                    el.tagName === 'SELECT' || el.isContentEditable);
    }

    function resetScanBuffer() {
      scanBuffer = '';
      clearTimeout(scanBufferTimer);
      document.getElementById('scanInput').value = '';
    }

    function looksLikeScan(b, now) {
      if (!b || b.chars.length < 4) return false;
      if (now - b.last > 150) return false;        // a pause before Enter = a person
      if (b.nonDigit) return true;                  // letters can't be a quantity
      const avgGap = (b.last - b.start) / (b.chars.length - 1);
      return avgGap < 40;                            // scanners type in a few ms per key
    }

    document.addEventListener('keydown', e => {
      if (!isStepActive('stepScan')) return;
      if (pickOpen()) {
        if (e.key === 'Escape' && pickCancelable) closePick();
        if (e.key === 'Enter' && document.getElementById('variantSaveAnyway')) {
          e.preventDefault();
          document.getElementById('variantSaveAnyway').click();
        }
        return;
      }
      if (isEditable(e.target)) return; // typing in a box handles itself
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      const now = performance.now();

      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        if (current) {
          if (looksLikeScan(burst, now)) {
            current.qty = burst.qtyBefore; // undo digits the scanner typed
            current.fresh = burst.freshBefore;
            renderQty();
            const code = burst.chars;
            burst = null;
            resetScanBuffer();
            handleCode(code);
          } else {
            burst = null;
            saveCurrent();
          }
        } else if (scanBuffer) {
          const code = scanBuffer;
          burst = null;
          resetScanBuffer();
          handleCode(code);
        }
        return;
      }

      if (current && e.key === 'Backspace') { e.preventDefault(); burst = null; numpadKey('back'); return; }
      if (current && e.key === 'Escape') { e.preventDefault(); burst = null; document.getElementById('skipBtn').click(); return; }
      if (e.key.length !== 1) return; // ignore arrows, Shift, etc.
      e.preventDefault();

      // Track how fast keys are arriving
      if (!burst || now - burst.last > 100) {
        burst = {
          chars: '', start: now, last: now, nonDigit: false,
          qtyBefore: current ? current.qty : '',
          freshBefore: current ? current.fresh : false
        };
      }
      burst.chars += e.key;
      burst.last = now;
      if (!/\d/.test(e.key)) burst.nonDigit = true;

      if (current) {
        if (/\d/.test(e.key) && !burst.nonDigit) numpadKey(e.key);
      } else {
        scanBuffer += e.key;
        document.getElementById('scanInput').value = scanBuffer;
        // Drop stray keystrokes if no Enter arrives
        clearTimeout(scanBufferTimer);
        scanBufferTimer = setTimeout(resetScanBuffer, 5000);
      }
    });

    updateSummary();


    /* ---------- phone camera scanning ----------
     *
     * Tap the camera button to scan with the phone's camera. After a scan the
     * camera closes so you can enter the quantity; once you Save or Skip it
     * opens again for the next item.
     *
     * Barcodes are read with the phone's built-in reader where it has one
     * (Android), otherwise with the same reader engine (ZXing) loaded on
     * demand, which is what iPhones use.
     *
     * The live camera doesn't work inside Google's Apps Script frame,
     * so phones use the GitHub copy of this page.
     */
    const DETECTOR_URL = 'https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js';
    const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39',
                     'code_93', 'itf', 'codabar', 'qr_code'];
    let detectorPromise = null;
    let stream = null;       // live camera
    let scanning = false;    // scan loop running
    let cameraMode = false;  // keep reopening the camera after each item
    let idleTimer = null;    // turns the camera off after a while unused
    const CAMERA_IDLE_MS = 10 * 60 * 1000; // off after 10 minutes unused

    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) document.body.classList.add('touch');

    const camVideo = document.getElementById('camVideo');
    const camCanvas = document.createElement('canvas');
    const camCtx = camCanvas.getContext('2d', { willReadFrequently: true });

    function getDetector() {
      if (!detectorPromise) {
        detectorPromise = (async () => {
          // Built-in reader (Android Chrome) if it handles product barcodes
          if (window.BarcodeDetector) {
            try {
              const sup = await window.BarcodeDetector.getSupportedFormats();
              if (sup.includes('ean_13')) {
                return new window.BarcodeDetector({ formats: FORMATS.filter(f => sup.includes(f)) });
              }
            } catch (e) {}
          }
          // Otherwise the ZXing reader (iPhone and others)
          const mod = await import(DETECTOR_URL);
          return new mod.BarcodeDetector({ formats: FORMATS });
        })().catch(e => { detectorPromise = null; throw e; });
      }
      return detectorPromise;
    }

    function camIdleMsg() {
      return quickMode ? 'Quick scan: each scan adds 1' : 'Hold the barcode inside the box';
    }

    function setCamMsg(msg) {
      const el = document.getElementById('camMsg');
      el.textContent = msg || '';
      el.className = '';
    }
    function camOpen() { return document.getElementById('camOverlay').classList.contains('open'); }

    /* ---------- change location / initials / zone from the scan screen ---------- */

    const pickModal = document.getElementById('pickModal');
    let pickCancelable = true;

    function pickOpen() { return pickModal.classList.contains('open'); }

    function openPick(title, html, cancelable) {
      document.getElementById('pickTitle').textContent = title;
      document.getElementById('pickBody').innerHTML = html;
      document.getElementById('pickMsg').textContent = '';
      pickCancelable = cancelable !== false;
      document.getElementById('pickCancel').style.display = pickCancelable ? 'block' : 'none';
      document.getElementById('pickCancel').textContent = 'Cancel';
      pickModal.classList.add('open');
    }

    function closePick() { pickModal.classList.remove('open'); pendingAfterCheck = null; }
    function pickMsg(t) { document.getElementById('pickMsg').textContent = t || ''; }

    // Finished a change: stay on the scan screen with the new choice
    function afterPickChange(note) {
      closePick();
      updateSummary();
      saveSession();
      setSaveStatus(note, 'ok');
    }

    document.getElementById('summary').addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip || !isStepActive('stepScan') || pickOpen()) return;
      if (chip.dataset.pick === 'location') openLocationPick();
      if (chip.dataset.pick === 'initials') openInitialsPick();
      if (chip.dataset.pick === 'zone') openZonePick(false);
    });
    document.getElementById('pickCancel').addEventListener('click', () => { if (pickCancelable) closePick(); });
    pickModal.addEventListener('click', e => { if (e.target === pickModal && pickCancelable) closePick(); });

    // Location
    function openLocationPick() {
      openPick('Change location',
        '<div class="loc-buttons">' +
          ['FC', 'MH', 'BA'].map(l =>
            '<button type="button" class="loc-btn" data-loc="' + l + '"' +
            (l === state.location ? ' style="outline:4px solid var(--text);outline-offset:-4px"' : '') +
            '>' + l + '</button>').join('') +
        '</div>');
    }

    function changeLocation(loc) {
      if (loc === state.location) { closePick(); return; }
      if (!appData) { pickMsg('Still loading. Try again in a moment.'); loadAppData(); return; }
      const info = appData[loc];
      if (!info || info.error) { pickMsg(info ? info.error : 'Unknown location'); return; }

      state.location = loc;
      state.itemCount = info.itemCount;
      state.zones = info.zones;
      state.done = new Set((info.done || []).map(z => z.toUpperCase()));
      state.zone = null;
      clearCurrent();
      document.getElementById('scanResult').innerHTML = '';
      if (items.error) items.location = null;
      loadItems(loc);
      try { localStorage.setItem('inv_last_loc', loc); } catch (e) {}

      if (state.zones) {
        updateSummary();
        openZonePick(true); // this location needs a zone
      } else {
        afterPickChange('Location changed to ' + loc);
      }
    }

    // Initials
    function openInitialsPick() {
      openPick('Change initials',
        '<div class="input-row">' +
          '<input type="text" id="pickInitials" maxlength="11" autocomplete="off" placeholder="e.g. JD or JD/MK">' +
          '<button type="button" class="go-btn" id="pickInitialsGo">Save</button>' +
        '</div>');
      const input = document.getElementById('pickInitials');
      input.value = state.initials;
      input.addEventListener('input', () => { input.value = cleanInitials(input.value); });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveInitialsPick(); } });
      document.getElementById('pickInitialsGo').addEventListener('click', saveInitialsPick);
      setTimeout(() => { input.focus(); input.select(); }, 50);
    }

    function saveInitialsPick() {
      const val = cleanInitials(document.getElementById('pickInitials').value).replace(/^\/+|\/+$/g, '');
      if (letterCount(val) < 2) { pickMsg('Please enter at least 2 letters.'); return; }
      state.initials = val;
      try { localStorage.setItem('inv_initials', val); } catch (e) {}
      afterPickChange('Initials changed to ' + val);
    }

    // Zone (required = just changed to a location that needs one: no Cancel)
    function openZonePick(required) {
      if (!state.zones) return; // this location has no zones
      refreshZoneDone();
      openPick(required ? 'Choose a zone for ' + state.location : 'Change zone',
        '<div class="input-row">' +
          '<input type="text" id="pickZoneInput" autocomplete="off" placeholder="Zone">' +
        '</div>' +
        '<div id="pickZoneGrid"></div>', !required);
      const input = document.getElementById('pickZoneInput');
      const render = () => {
        const typed = input.value.trim().toUpperCase();
        const list = state.zones.filter(z => z.toUpperCase().includes(typed));
        document.getElementById('pickZoneGrid').innerHTML = list.length
          ? zoneButtonsHtml(list, state.zone)
          : '<div style="grid-column:1/-1;text-align:center;color:var(--muted)">No matching zones</div>';
      };
      input.addEventListener('input', render);
      input.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const typed = input.value.trim().toUpperCase();
        if (!typed) return;
        const exact = state.zones.find(z => z.toUpperCase() === typed);
        const matches = state.zones.filter(z => z.toUpperCase().includes(typed));
        if (exact) changeZone(exact);
        else if (matches.length === 1) changeZone(matches[0]);
        else pickMsg(matches.length ? 'More than one zone matches. Tap the one you want.' : 'That zone isn\'t in the list.');
      });
      render();
    }

    function changeZone(zone) {
      state.zone = zone;
      afterPickChange('Zone changed to ' + zone);
    }

    document.getElementById('pickBody').addEventListener('click', e => {
      const locBtn = e.target.closest('[data-loc]');
      if (locBtn) { changeLocation(locBtn.dataset.loc); return; }
      const zoneBtn = e.target.closest('.zone-btn');
      if (zoneBtn) changeZone(zoneBtn.dataset.zone);
    });

    /* ---------- last 5 items counted ----------
     * Kept on this device, for the person logged in (by initials) and the
     * current location.
     */
    const RECENT_KEY = 'inv_recent';

    function readRecent() {
      try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch (e) { return []; }
    }

    function addRecent(idx, qty) {
      const row = items.rows[idx];
      if (!row) return;
      const list = readRecent();
      list.unshift({
        loc: state.location, who: state.initials, zone: state.zone || '',
        sku: row[0], name: row[1], qty: qty, t: Date.now()
      });
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 50))); } catch (e) {}
      renderRecent();
    }

    function renderRecent() {
      const el = document.getElementById('recentList');
      const list = readRecent()
        .filter(r => r.loc === state.location && r.who === state.initials)
        .slice(0, 5);
      el.innerHTML = list.length
        ? '<h4>Recent Scans</h4><div class="recent-list">' + list.map(r =>
            '<div class="recent-row">' +
              '<span class="recent-qty">' + r.qty + '</span>' +
              '<span class="recent-name">' + escapeHtml(r.sku + ' ' + r.name) + '</span>' +
            '</div>').join('') + '</div>'
        : '';
    }

    /* ---------- keep zone status current ----------
     * Zones finished by anyone show as done on every device: checked when
     * the zone list opens, when the scan screen opens, and every 30 seconds
     * while counting.
     */
    let zoneRefreshBusy = false;

    function refreshZoneDone() {
      const loc = state.location;
      if (!loc || !state.zones || !password || zoneRefreshBusy) return;
      zoneRefreshBusy = true;
      callServer('getZoneDone', loc)
        .then(done => {
          zoneRefreshBusy = false;
          if (state.location !== loc || !Array.isArray(done)) return;
          const set = new Set(done.map(z => String(z).toUpperCase()));
          // keep zones this device marked that haven't reached the sheet yet
          saveQueue.forEach(e => { if (e.type === 'zone' && e.loc === loc) set.add(String(e.zone).toUpperCase()); });
          state.done = set;
          if (appData && appData[loc]) appData[loc].done = done.slice();
          updateSummary();
          if (isStepActive('stepZone')) renderZones();
          const pz = document.getElementById('pickZoneInput');
          if (pz && pickOpen()) pz.dispatchEvent(new Event('input'));
        })
        .catch(() => { zoneRefreshBusy = false; });
    }

    setInterval(() => {
      if (document.hidden) return;
      if (isStepActive('stepScan') || isStepActive('stepZone')) refreshZoneDone();
    }, 30000);

    /* ---------- notes ----------
     * Note on the item being counted. Saved to the Notes sheet in the
     * background; then it's straight back to the count for this item.
     */
    function openNote() {
      if (!current || pickOpen()) return;
      const row = items.rows[current.index];
      const code = current.code;
      const sku = row[0];
      const desc = row[1];
      openPick('Add a note',
        '<div style="text-align:center;color:var(--muted);margin-bottom:10px">' + escapeHtml(sku + ' ' + desc) + '</div>' +
        '<textarea id="noteText" rows="4" maxlength="500" placeholder="Type a note" ' +
          'style="width:100%;padding:12px;font:inherit;font-size:1.05rem;border:2px solid var(--border);border-radius:10px;resize:vertical"></textarea>' +
        '<button type="button" class="save-btn" id="noteSave" style="width:100%;margin-top:12px;padding:14px 0;font-size:1.1rem;font-weight:bold;border-radius:10px;cursor:pointer">Save note</button>');
      const ta = document.getElementById('noteText');
      setTimeout(() => ta.focus(), 50);
      document.getElementById('noteSave').addEventListener('click', () => {
        const note = ta.value.trim();
        if (!note) { pickMsg('Type a note first.'); return; }
        queueEntry({ type: 'note', loc: state.location, sku: sku, code: code, desc: desc, note: note });
        closePick();
        setSaveStatus('✓ Note added. Now enter the count', 'ok');
      });
    }

    /* ---------- zone complete ---------- */

    function confirmZoneDone() {
      if (!state.zone || pickOpen()) return;
      if (isZoneDone(state.zone)) { openZonePick(false); return; } // already done: pick the next one
      const zone = state.zone;
      openPick('Mark zone ' + zone + ' complete?',
        '<p style="text-align:center;margin:0 0 14px;color:var(--muted)">Only do this once every item in the zone has been counted.</p>' +
        '<button type="button" class="save-btn" id="zoneDoneYes" style="width:100%;padding:16px 0;font-size:1.15rem;font-weight:bold;border-radius:10px;cursor:pointer">Mark complete</button>');
      document.getElementById('zoneDoneYes').addEventListener('click', () => markZoneDone(zone));
    }

    function markZoneDone(zone) {
      state.done.add(zone.toUpperCase());
      if (appData && appData[state.location]) {
        const d = appData[state.location].done || (appData[state.location].done = []);
        if (d.indexOf(zone) === -1) d.push(zone);
      }
      queueEntry({ type: 'zone', loc: state.location, zone: zone, initials: state.initials });
      closePick();
      updateSummary();
      setSaveStatus('✓ Zone ' + zone + ' marked complete', 'ok');

      // Straight on to the next zone
      const left = state.zones.filter(z => !isZoneDone(z)).length;
      openZonePick(false);
      document.getElementById('pickTitle').textContent = left
        ? 'Zone ' + zone + ' complete. Choose the next zone'
        : 'All zones in ' + state.location + ' are complete';
    }

    /* ---------- status ---------- */

    function openStatus() {
      if (pickOpen()) return;
      openPick('Status', '<div style="text-align:center;color:var(--muted);padding:20px 0">Loading…</div>');
      document.getElementById('pickCancel').textContent = 'Close';
      callServer('getStatus')
        .then(st => { if (pickOpen()) renderStatus(st); })
        .catch(err => {
          if (isLoginError(err)) { closePick(); loginExpired(); return; }
          pickMsg('Could not load the status. ' + err.message);
        });
    }

    function renderStatus(st) {
      // Keep this device's zone list in step with what everyone has marked
      Object.keys(st).forEach(loc => {
        if (appData && appData[loc] && st[loc].ready) appData[loc].done = st[loc].done || [];
      });
      if (state.location && st[state.location] && st[state.location].ready) {
        (st[state.location].done || []).forEach(z => state.done.add(z.toUpperCase()));
        updateSummary();
      }

      // A location is selected: show just that one. Otherwise show them all.
      const locs = state.location ? [state.location] : ['FC', 'MH', 'BA'];
      document.getElementById('pickTitle').textContent = state.location ? state.location + ' status' : 'Status';

      const html = locs.map(loc => {
        const s = st[loc];
        if (!s || !s.ready) {
          return '<div class="st-loc"><div class="st-head"><b>' + loc + '</b><span class="st-sub">Not started</span></div></div>';
        }

        // Progress bar = zones complete
        let zonesHtml = '';
        let headRight = '';
        if (s.zones && s.zones.length) {
          const doneSet = new Set((s.done || []).map(z => z.toUpperCase()));
          const doneN = s.zones.filter(z => doneSet.has(z.toUpperCase())).length;
          const pct = Math.round(doneN / s.zones.length * 100);
          headRight = doneN + ' of ' + s.zones.length + ' zones complete';
          zonesHtml =
            '<div class="st-bar"><span style="width:' + pct + '%"></span></div>' +
            '<div class="st-zones">' + s.zones.map(z =>
              '<span class="st-zone' + (doneSet.has(z.toUpperCase()) ? ' done' : '') + '">' + escapeHtml(z) + '</span>'
            ).join('') + '</div>';
        }

        // Items: only those with expected stock
        const itemsHtml = s.items
          ? '<div class="st-sub" style="margin-top:8px">' + s.counted.toLocaleString() + ' of ' +
              s.items.toLocaleString() + ' items with expected stock counted · ' +
              s.units.toLocaleString() + ' units</div>'
          : '<div class="st-sub" style="margin-top:8px">No items with expected stock</div>';

        // % done by SKUs scanned vs SKUs expected (max 100%)
        const pctHtml = '<div class="st-pct"><b>' + (s.pctDone || 0) + '%</b> done' +
          '<span class="st-sub"> · SKUs scanned vs. expected</span></div>';

        return '<div class="st-loc">' +
          '<div class="st-head"><b>' + loc + '</b><span class="st-sub">' + headRight + '</span></div>' +
          pctHtml +
          zonesHtml +
          itemsHtml +
        '</div>';
      }).join('');
      document.getElementById('pickBody').innerHTML = html;
    }

    async function openCamera() {
      if (!isStepActive('stepScan')) return;
      ensureAudio();
      cameraMode = true;
      document.getElementById('camOverlay').classList.add('open');
      clearTimeout(idleTimer);

      // Camera still running from the last scan: just start reading again.
      // (Restarting it would make the phone ask/announce camera access each time.)
      if (stream && stream.getVideoTracks().some(t => t.readyState === 'live')) {
        if (scanning) return;
        try { await camVideo.play(); } catch (e) {}
        try {
          const detector = await getDetector();
          if (!camOpen()) return;
          setCamMsg(camIdleMsg());
          scanning = true;
          scanLoop(detector);
        } catch (e) {
          setCamMsg('Could not load the scanner. Check the connection and try again.');
        }
        return;
      }
      stopCamera();
      setCamMsg('Starting camera…');

      const detectorReady = getDetector(); // load the reader while the camera starts

      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera');
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
      } catch (e) {
        stream = null;
        setCamMsg(inAppsScript
          ? 'The camera can\'t be used on this link. Open the app from the GitHub link to scan with the camera.'
          : 'Could not start the camera. Check that camera access is allowed for this browser, then try again.');
        return;
      }
      if (!camOpen()) { stopCamera(); return; } // closed while starting

      camVideo.srcObject = stream;
      try { await camVideo.play(); } catch (e) {}

      // Keep refocusing where the phone allows it
      try {
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}

      let detector;
      try {
        setCamMsg('Loading scanner…');
        detector = await detectorReady;
      } catch (e) {
        setCamMsg('Could not load the scanner. Check the connection and try again.');
        stopCamera();
        return;
      }
      if (!camOpen() || !stream) { stopCamera(); return; }

      setCamMsg(camIdleMsg());
      scanning = true;
      scanLoop(detector);
    }

    async function scanLoop(detector) {
      while (scanning) {
        const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
        if (vw && vh && camVideo.readyState >= 2) {
          // Read the middle of the picture (around the aim box, a little
          // generous), scaled down: faster, and the reader works better
          const side = Math.min(vw, vh);
          const cropW = Math.round(Math.min(vw, side * 1.05));
          const cropH = Math.round(Math.min(vh, side * 0.9));
          const sx = Math.round((vw - cropW) / 2);
          const sy = Math.round((vh - cropH) / 2);
          const scale = Math.min(1, 1024 / cropW);
          camCanvas.width = Math.round(cropW * scale);
          camCanvas.height = Math.round(cropH * scale);
          camCtx.drawImage(camVideo, sx, sy, cropW, cropH, 0, 0, camCanvas.width, camCanvas.height);
          try {
            const found = await detector.detect(camCanvas);
            if (scanning && found && found.length) {
              onCameraScan(found[0].rawValue); // reading carries on afterwards
              await new Promise(r => setTimeout(r, 250));
            }
          } catch (e) {}
        }
        await new Promise(r => setTimeout(r, 60));
      }
    }

    /*
     * Camera flow: scan → quantity pop-up over the camera → Save/Skip →
     * straight back to scanning. A barcode that isn't found shows the red
     * message for a moment, then scanning resumes on its own.
     */
    const camOverlayEl = document.getElementById('camOverlay');
    const camSheetEl = document.getElementById('camSheet');
    const resultEl = document.getElementById('scanResult');
    const qtyPanelEl = document.getElementById('qtyPanel');
    // Where these normally live on the scan screen
    const resultHome = { parent: resultEl.parentNode, next: resultEl.nextSibling };
    const qtyHome = { parent: qtyPanelEl.parentNode, next: qtyPanelEl.nextSibling };
    let lastCamCode = '', lastCamTime = 0;
    let resumeTimer = null;
    let camMsgTimer = null;

    function enterCamSheet() {
      camSheetEl.appendChild(resultEl);
      camSheetEl.appendChild(qtyPanelEl);
      camOverlayEl.classList.add('sheet');
    }

    function exitCamSheet() {
      clearTimeout(resumeTimer);
      if (!camOverlayEl.classList.contains('sheet')) return;
      camOverlayEl.classList.remove('sheet');
      resultHome.parent.insertBefore(resultEl, resultHome.next);
      qtyHome.parent.insertBefore(qtyPanelEl, qtyHome.next);
    }

    function inCamSheet() { return camOverlayEl.classList.contains('sheet'); }

    /*
     * Normal: a scan opens the quantity screen (the camera pauses), and
     * Save / Skip goes straight back to scanning.
     * Quick scan (toggle in the camera window): each scan adds 1 straight
     * away and the camera keeps going. The same barcode staying in view is
     * ignored; move it away for 2 seconds to count another of the same item.
     * Anything that needs attention (not found, variant check) opens the
     * normal screen, then quick scan carries on.
     */
    function onCameraScan(text) {
      text = String(text).trim();
      if (!text || pickOpen() || inCamSheet()) return;
      const key = normCode(text);
      const now = Date.now();
      // Same barcode still in view: ignore it while it stays there
      if (key === normCode(lastCamCode) && now - lastCamTime < 2000) {
        lastCamTime = now;
        return;
      }
      lastCamCode = text;
      lastCamTime = now;

      if (quickMode && quickAdd(text)) return;

      scanning = false; // pause reading while the quantity screen is up
      clearTimeout(resumeTimer);
      enterCamSheet();
      lastScan = { key: '', time: 0 }; // the camera has its own in-view guard
      handleCode(text);
      // Quick scan stopped for a variant check: show it straight away
      if (quickMode && current && !current.variantOk) {
        const list = variantCheck(current);
        if (list) showVariantCheck(list);
      }
      // Not found (or an error): show it briefly, then keep scanning
      resumeTimer = setTimeout(maybeResume, 1800);
    }

    /* ---------- quick scan ---------- */
    let quickMode = false;
    try { quickMode = localStorage.getItem('inv_quick') === '1'; } catch (e) {}
    const quickVariantOk = new Set(); // items confirmed in the variant check this session

    // Adds 1 for a scanned barcode. Returns false when the normal screen is
    // needed instead (not found, still loading, or a variant check).
    function quickAdd(text) {
      if (!items.index) return false;
      const key = normCode(text);
      const m = items.index.get(key) || (items.skuIndex && items.skuIndex.get(key));
      if (!m) return false;                       // not found: normal screen handles it
      const idx = m[0];
      if (!quickVariantOk.has(idx) && variantCheck({ index: idx, qty: 1 })) return false;
      lastScan = { key: key, time: Date.now() };  // so the scan isn't repeated elsewhere
      playPop();
      const total = recordCount(idx, text, 1);
      const row = items.rows[idx];
      flashCamMsg('+1  ' + row[0] + ' ' + row[1] + '  ·  Total ' + total);
      setSaveStatus('✓ Counted 1 · Total ' + total, 'ok');
      return true;
    }

    function renderQuickToggle() {
      const btn = document.getElementById('camQuick');
      btn.classList.toggle('on', quickMode);
      btn.textContent = quickMode ? 'Quick scan ON' : 'Quick scan Off';
      document.getElementById('camOverlay').classList.toggle('quick', quickMode);
    }

    document.getElementById('camQuick').addEventListener('click', () => {
      quickMode = !quickMode;
      try { localStorage.setItem('inv_quick', quickMode ? '1' : '0'); } catch (e) {}
      renderQuickToggle();
      if (camOpen() && !inCamSheet()) {
        setCamMsg(camIdleMsg());
      }
    });
    renderQuickToggle();

    function maybeResume() {
      if (!inCamSheet() || current) return;          // waiting for a quantity
      if (resultEl.querySelector('.sku-fix')) return; // waiting for a SKU or Skip
      if (pendingScan) { resumeTimer = setTimeout(maybeResume, 500); return; } // still loading
      lastCamTime = Date.now();
      resultEl.innerHTML = '';
      exitCamSheet();
      openCamera();
    }

    function stopCamera() {
      scanning = false;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      camVideo.srcObject = null;
    }

    // keepMode = true: hide the camera after a scan but keep it running for the
    // next item (no new permission prompt). false: turn it off completely.
    /*
     * Hides the camera. The camera itself keeps running in the background
     * (even after Close or leaving the scan screen), because every restart
     * makes the phone ask for / announce camera access again. It turns off
     * after 10 minutes unused, when the app goes to the background, or on
     * log out.
     * keepMode = true: reopen the camera automatically after the next Save/Skip.
     * stopNow = true: turn the camera off right away.
     */
    function closeCamera(keepMode, stopNow) {
      exitCamSheet();
      document.getElementById('camOverlay').classList.remove('open');
      scanning = false;
      if (!keepMode) cameraMode = false;
      clearTimeout(idleTimer);
      if (stream && !stopNow) {
        idleTimer = setTimeout(() => { cameraMode = false; stopCamera(); }, CAMERA_IDLE_MS);
      } else {
        stopCamera();
      }
    }

    /*
     * App goes to the background (screen locks, another app opened):
     * pause reading but don't turn the camera off ourselves. Turning it off
     * makes the phone ask for permission again on return; if the phone keeps
     * it, the camera simply resumes. If the phone did turn it off, the next
     * tap of the scanner icon starts it again. The 10-minute idle timer still
     * turns it off if it isn't used.
     */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        scanning = false;
      } else if (camOpen() && stream) {
        openCamera(); // resume reading (restarts the camera only if the phone stopped it)
      }
    });

    // After Save / Skip, go straight back to the camera for the next item
    function reopenCameraIfUsing() {
      if (inCamSheet()) {
        // Saved or skipped from the pop-up: straight back to scanning,
        // with the result shown briefly under the camera
        const msg = document.getElementById('saveStatus').textContent;
        exitCamSheet();
        lastCamTime = Date.now();
        openCamera().then(() => flashCamMsg(msg));
        return;
      }
      if (cameraMode && isStepActive('stepScan')) setTimeout(openCamera, 250);
    }

    function flashCamMsg(msg) {
      if (!msg || !camOpen()) return;
      const el = document.getElementById('camMsg');
      el.textContent = msg;
      el.className = 'ok';
      clearTimeout(camMsgTimer);
      camMsgTimer = setTimeout(() => {
        if (el.textContent === msg) { el.className = ''; setCamMsg(camIdleMsg()); }
      }, 2000);
    }

    document.getElementById('camClose').addEventListener('click', () => closeCamera(false));
    document.getElementById('camBtn').addEventListener('mousedown', e => e.preventDefault());

    // On phones, load the reader in the background so the camera is quick
    if (isTouch) {
      setTimeout(() => {
        getDetector().then(d => {
          const c = document.createElement('canvas'); c.width = c.height = 8;
          return d.detect(c); // warms up the reader engine
        }).catch(() => {});
      }, 1500);
    }

    // Resume any counts left unsent from last time
    if (saveQueue.length) { renderSyncBar(); if (password) sendQueue(); }

    // Head start: begin loading items for the location this device used last,
    // at the same time as the data above. Picking another location switches over.
    function startHeadStart() {
      try {
        const lastLoc = localStorage.getItem('inv_last_loc');
        if (lastLoc === 'FC' || lastLoc === 'MH' || lastLoc === 'BA') loadItems(lastLoc);
      } catch (e) {}
    }
    // Runs last, once everything above is set up.
    // Saved password on this device: go straight to locations and start loading.
    // (If it no longer works, the login screen comes up.)
    if (password) {
      // Refresh the login type in the background (it may have changed on the sheet)
      callServer('login').then(res => applyUserType(res && res.type)).catch(err => {
        if (isLoginError(err)) loginExpired();
      });
      const sess = readSession();
      if (sess) {
        // Pick up where this device left off
        state.location = sess.loc;
        state.initials = sess.initials;
        state.zone = sess.zone || null;
        state.zones = sess.zone ? [] : null; // real list arrives with the location details
        loadItems(sess.loc);
        goToScan();
        loadAppData();
      } else {
        showStep('stepLocation');
        loadAppData();
        startHeadStart();
      }
    } else {
      showStep('stepLogin');
      // Wake the script while the password is being typed, so the check is quick
      callServer('ping').catch(() => {});
    }
  </script>
</body>
</html>
